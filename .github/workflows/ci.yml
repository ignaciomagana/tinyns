name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
        x64: ["0"]
        jax: ["latest"]
        include:
          # The full suite with 64-bit floats as well.
          - python-version: "3.11"
            x64: "1"
            jax: "latest"
          # The minimum supported JAX (pyproject.toml), on the minimum Python.
          - python-version: "3.10"
            x64: "0"
            jax: "0.4.31"
          - python-version: "3.10"
            x64: "1"
            jax: "0.4.31"
    name: test (py${{ matrix.python-version }}, x64=${{ matrix.x64 }}, jax ${{ matrix.jax }})
    env:
      JAX_ENABLE_X64: ${{ matrix.x64 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Pin JAX
        if: matrix.jax != 'latest'
        run: python -m pip install "jax==${{ matrix.jax }}" "jaxlib==${{ matrix.jax }}"

      - name: Run Ruff
        run: ruff check .

      - name: Run tests
        run: pytest
