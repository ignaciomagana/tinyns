name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: ruff check .

      - name: Run tests
        run: pytest

  ab-bitwise:
    # Same-machine A/B: the PR must reproduce its base branch bit for bit.
    # Label a PR "numerics-change" when it changes results on purpose.
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'numerics-change')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Compare against the base branch
        run: python tools/ab_bitwise.py --base origin/${{ github.base_ref }}
