[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tinyns"
version = "1.0.0.dev0"
description = "A tiny, fast, general-purpose nested sampler in JAX."
keywords = ["nested-sampling", "jax", "gpu", "bayesian-inference", "evidence", "monte-carlo"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering :: Physics",
]
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "tinyns contributors" },
]
dependencies = [
  "jax>=0.4.31",
  "jaxlib",
  "numpy",
]

[project.urls]
Homepage = "https://github.com/ignaciomagana/tinyns"
Repository = "https://github.com/ignaciomagana/tinyns"
Issues = "https://github.com/ignaciomagana/tinyns/issues"
Changelog = "https://github.com/ignaciomagana/tinyns/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tinyns"]

[tool.pytest.ini_options]
testpaths = ["tests", "bench/tests"]
pythonpath = ["src", "."]
# Heavy statistical gates are marked slow and skipped by default; run them
# with `pytest -m slow` (the last -m wins).
addopts = "-m 'not slow'"
markers = ["slow: heavy statistical gates (run with -m slow)"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
